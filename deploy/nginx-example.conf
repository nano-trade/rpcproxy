# Example nginx site for the proxy behind Cloudflare.
# Needs /etc/nginx/conf.d/cloudflare.conf from deploy/update-cloudflare-ips
# (provides the real visitor IP and $via_cloudflare).

upstream rpcproxy_banano {
    server 127.0.0.1:9950;
    keepalive 32;
}

server {
    listen 443 ssl;
    server_name api.example.com;
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # drop anything that did not come through Cloudflare
    if ($via_cloudflare = 0) { return 444; }

    client_max_body_size 256k;
    location / {
        proxy_pass http://rpcproxy_banano;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl;
    server_name ws.example.com;
    ssl_certificate     /etc/letsencrypt/live/ws.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.example.com/privkey.pem;

    if ($via_cloudflare = 0) { return 444; }

    location / {
        proxy_pass http://127.0.0.1:9952;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
